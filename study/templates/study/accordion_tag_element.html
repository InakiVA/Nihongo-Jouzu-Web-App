<div class="collapser collapse-plus border-neutral-main!">
    <input type="radio" name="value_accordion"/>
    <div class="collapse-title flex items-end gap-4">  
        <h2>{{header}}</h2>              
        <li class="flex flex-row w-auto flex-wrap overflow-auto gap-2 ">
            {% for tag in elements %}
            {% include "components/tag.html" with element=tag %}         
            {% endfor %}
        </li>                         
    </div>
    <div class="collapse-content">
        {% include "components/select_button.html" with name=select_name icon="components/icons/add_mini.html" url=url button_text="Agregar" options=options%}             
    </div>  
</div>
